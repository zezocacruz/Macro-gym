<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTrack - Estatísticas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bar">
        <a href="index.html" class="app-bar-back" aria-label="Voltar">&#8592;</a>
        <span class="app-bar-titulo">Estatísticas</span>
        <button class="btn-tema" id="btn-tema" onclick="toggleTema()" title="Mudar tema" aria-label="Mudar tema">☀️</button>
    </div>

    <div class="container">
        <h1 class="titulo-pagina">Estatísticas</h1>
        <p class="subtitulo">Gráficos do teu progresso</p>

        <div class="card">
            <h2>Peso ao longo do tempo</h2>
            <div class="grafico-wrapper">
                <canvas id="grafico-peso"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Calorias nos últimos 14 dias</h2>
            <p class="subtitulo" style="margin-bottom:1rem;">A linha vermelha tracejada é o teu objetivo diário.</p>
            <div class="grafico-wrapper">
                <canvas id="grafico-calorias"></canvas>
            </div>
        </div>

        <div class="grid-dashboard">
            <div class="card">
                <h2>Macros médios (últimos 7 dias)</h2>
                <p class="subtitulo" style="margin-bottom:1rem; font-size:0.85rem;">Distribuição média em calorias.</p>
                <div class="grafico-wrapper" style="height:280px;">
                    <canvas id="grafico-macros"></canvas>
                </div>
            </div>
            <div class="card">
                <h2>Água nos últimos 14 dias</h2>
                <p class="subtitulo" style="margin-bottom:1rem; font-size:0.85rem;">Quantidade em ml consumida por dia.</p>
                <div class="grafico-wrapper" style="height:280px;">
                    <canvas id="grafico-agua"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="alimentos.js"></script>
    <script src="script.js"></script>
</body>
</html>
